services:
  server:
    build: .
    ports:
      - "${SESSION_NOTIFY_HOST_PORT:-${SESSION_NOTIFY_PORT:-8765}}:${SESSION_NOTIFY_PORT:-8765}"
    environment:
      SESSION_NOTIFY_DB: /data/session_notify.db
      SESSION_NOTIFY_CERT_FILE: /run/secrets/server.crt
      SESSION_NOTIFY_KEY_FILE: /run/secrets/server.key
      SESSION_NOTIFY_GATEWAY_STATUS_URL: "${SESSION_NOTIFY_GATEWAY_STATUS_URL:-http://public-https:9080/status}"
    volumes:
      - session_notify_data:/data
      - ./runtime/secrets:/run/secrets:ro
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "${SESSION_NOTIFY_PORT:-8765}"
      - --log-config
      - logging.json
      - --ssl-certfile
      - /run/secrets/server.crt
      - --ssl-keyfile
      - /run/secrets/server.key

volumes:
  session_notify_data:

openapi: 3.1.0
info:
  title: Session Notify API
  version: 0.1.0
  description: POST / PUT / PATCH / DELETE 请求体上限 256 KiB，应用读取期限 15 秒（超时返回 408）；限制在应用层生效，直连后端同样受限。前置网关可能先返回自身的错误格式。
servers:
  - url: https://localhost:8765
security:
  - bearerAuth: []
paths:
  /api/v1/server/certificates:
    get:
      description: 仅管理员可读取。返回后端启动时的证书元数据和 HTTPS 网关实际加载的公网证书，不包含私钥或 ACME 账户。gateway_state 为 unavailable 时不能据此认定此前的证书过期已恢复；客户端按 server_time 判断不足 48 小时并本地提醒。
      responses:
        "200":
          description: 证书有效期和观测状态。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CertificateStatus"
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "403":
          description: 仅管理员可读取证书状态。
  /health:
    get:
      security: []
      responses:
        "200":
          description: 服务健康状态。
  /api/v1/devices/bind:
    post:
      description: strict 模式仅允许使用未到期且未撤销的刷新令牌重新绑定已有设备，保留角色和原刷新到期时间，不能自行续期。新设备须消费本机初始化码或管理员签发的配对码；初始化创建管理员，后续邀请默认 member。客户端不能在绑定时自行选择角色。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceBindRequest"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: 设备凭据。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBindResponse"
  /api/v1/devices/pair/issue:
    post:
      description: 仅当前有效管理员可调用。可选择 admin、member（默认）或 guest（仅本机）。角色和刷新有效期随一次性配对码保存，加入设备不能覆盖。省略有效期默认绑定后 90 天（可由服务端配置覆盖）；可设相对天数、绝对日期或永久。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairIssueRequest"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: 管理员签发的一次性配对码。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairIssueResponse"
        "403":
          description: 仅管理员可邀请设备。
  /api/v1/devices/pair/status:
    post:
      description: 仅管理员可查询自己签发的配对码进度。普通设备仍可查看设备列表和通知，游客仅可访问本机范围。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairStatusRequest"
      responses:
        "200":
          description: 配对进度。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairStatusResponse"
        "403":
          description: 需要管理员角色。
        "404":
          description: 未找到配对码。
  /api/v1/devices/pair/consume:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairConsumeRequest"
      responses:
        "200":
          description: 新绑定设备的凭据。初始化码创建管理员；设备签发的配对码携带管理员选择的角色，签发设备被撤销或降级后失效。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBindResponse"
  /api/v1/devices:
    get:
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: 已绑定设备；游客仅收到本机设备。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
  /api/v1/devices/presence:
    get:
      responses:
        "200":
          description: 当前有效的 Windows 在线状态；游客的设备列表与汇总计数仅包含本机。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePresenceSummary"
  /api/v1/devices/me/presence:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePresenceUpdateRequest"
      responses:
        "200":
          description: 更新后的 Windows 在线状态汇总；游客仅包含请求设备。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePresenceSummary"
        "422":
          description: 仅已绑定的 Windows 设备可上报桌面会话状态。
  /api/v1/devices/{device_id}:
    patch:
      description: 管理员可修改任意设备及其角色。普通设备与游客只能修改本机名称和通知接收设置，不能修改自身角色。角色变更以 WebSocket 1012 断开目标连接，促使客户端重连并刷新活动通知快照。不能降级最后一台有效管理员。
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdateRequest"
      responses:
        "200":
          description: 更新后的设备。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "403":
          description: 设备管理权限不足。
        "409":
          description: 必须保留至少一台有效管理员设备。
    delete:
      description: 管理员可撤销其他设备，普通设备和游客只能撤销本机。不能通过 API 撤销最后一台有效管理员。
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 已撤销的设备。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "403":
          description: 设备管理权限不足。
        "409":
          description: 必须保留至少一台有效管理员设备。
  /api/v1/auth/refresh:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "401":
          $ref: "#/components/responses/AuthenticationRequired"
        "200":
          description: 已有设备的新访问令牌；普通刷新不轮换刷新令牌，也不延长刷新有效期。到期设备可保留凭据，等待管理员延期后用同一刷新令牌恢复。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
  /api/v1/notifications:
    get:
      description: 返回最近 30 天内创建的匹配通知，默认仅查询 active 状态。游客仅收到 origin_device_id 为本机认证设备的通知，不包含来源未知的通知。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/NotificationStatus"
      responses:
        "200":
          description: 通知列表。
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      description: 与 Hook 共享每设备发布额度，默认每个 UTC 自然分钟 600 次、每个 UTC 日 64 MiB 模型 JSON 载荷。通过入口校验、鉴权及额度检查的重试同样计入，后续业务失败不退还；额度拒绝的请求不增加计数。查询与确认不受此发布额度影响。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreate"
      responses:
        "200":
          description: 已创建的通知。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "408":
          $ref: "#/components/responses/RequestBodyTimeout"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidPublication"
        "429":
          $ref: "#/components/responses/PublicationLimit"
  /api/v1/notifications/recent:
    get:
      description: 先应用游客可见范围，再筛选、分页、计数和生成筛选建议；游客仅能查看来源为本机的通知。按时间从新到旧返回游标分页；请求超过 30 天时限制为 30 天。
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/NotificationStatus"
        - name: level
          in: query
          required: false
          description: 仅返回指定消息级别的通知；重复该参数可选择多个级别。
          schema:
            type: array
            items:
              $ref: "#/components/schemas/NotificationLevel"
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: visible_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: suppress_codex_permission_requests
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: machine
          in: query
          required: false
          description: 大小写不敏感的字面子串，匹配来源设备名称或 ID。
          schema:
            type: string
            maxLength: 120
        - name: agent
          in: query
          required: false
          description: 大小写不敏感的字面子串，匹配通知来源。
          schema:
            type: string
            maxLength: 40
        - name: tag
          in: query
          required: false
          description: 大小写不敏感的字面子串，匹配通知 metadata 中的任务标签。
          schema:
            type: string
            maxLength: 120
        - name: q
          in: query
          required: false
          description: 大小写不敏感的字面子串，匹配标题、正文、会话、来源、机器名和标签。对 hide 正文，或非来源设备查看 local 正文时，不会用存储中的明文正文做关键词匹配。
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: 一页最近通知。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
  /api/v1/notifications/{notification_id}/ack:
    post:
      description: 游客只能确认本机发布的通知；不可访问的 ID 返回 404，不修改通知。
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AckRequest"
      responses:
        "200":
          description: 确认结果。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
  /api/v1/events:
    get:
      description: 游客仅收到本机发布通知的事件，包括确认和过期；分页与游标使用相同范围，不下发其他设备的确认身份和自定义原因。
      parameters:
        - name: since_event_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: 传入此参数时限制事件补拉数量；不带游标时仅返回最新事件 ID 作为基线。省略 limit 时保留原有事件补拉行为。
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: 补拉事件流。
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
  /api/v1/hooks/{source}:
    post:
      description: 与通知发布共享每设备额度，默认每个 UTC 自然分钟 600 次、每个 UTC 日 64 MiB 模型 JSON 载荷。通过入口校验、鉴权及额度检查的重试和被策略抑制的事件同样计入，后续业务失败不退还；额度拒绝的请求不增加计数。额度可由管理员配置。
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookPayload"
      responses:
        "200":
          description: Hook 创建的通知，或未创建通知时的 null（如回答关联、完成信号或被策略抑制的事件）。
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/Notification"
                  - type: "null"
        "408":
          $ref: "#/components/responses/RequestBodyTimeout"
        "413":
          $ref: "#/components/responses/RequestTooLarge"
        "422":
          $ref: "#/components/responses/InvalidPublication"
        "429":
          $ref: "#/components/responses/PublicationLimit"
  /api/v1/ws:
    get:
      summary: WebSocket 连接入口。
      description: >-
        游客仅收到本机范围事件。鉴权优先使用 Authorization Bearer，其次使用 token 查询参数。
        连接前、广播前及空闲期间检查 access 和 refresh 到期时间；失效关闭 1008，
        reason 尽可能为 access_token_expired、refresh_token_expired、device_revoked 或 invalid_token，广播关闭时 reason 可能为空。
        角色或有效期修改以 1012 关闭目标连接，客户端先更新授权状态再重连并刷新快照。
        refresh 到期期间不得维持或重连业务 WebSocket，只允许每小时一次 refresh 恢复检查。
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        "101":
          description: 升级为 WebSocket；消息格式见 ws-events.schema.json。
components:
  responses:
    RequestBodyTimeout:
      description: 应用读取请求体超过 15 秒，detail 为字符串 Request body timed out。
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail:
                type: string
    RequestTooLarge:
      description: 请求体超过 262144 字节，detail.code 为 request_too_large；缩小载荷后重试。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicationErrorResponse"
    InvalidPublication:
      description: 字段类型、metadata 或完整 Hook 输入不满足大小 / 深度 / 总值数约束；修正载荷后重试。入口模型校验返回 detail 数组，生成或合并 metadata 的校验返回 detail 对象（code 为 invalid_metadata），调用端须兼容两种格式。
    PublicationLimit:
      description: 每设备发布额度耗尽。detail.code 为 publish_rate_limited 或 publish_daily_quota；计数跨重启和多进程保持。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/PublicationErrorResponse"
      headers:
        Retry-After:
          description: 距对应 UTC 分钟或 UTC 日窗口结束的秒数。
          schema:
            type: integer
            minimum: 1
    AuthenticationRequired:
      description: >-
        结构化鉴权错误。业务请求 invalid_token 也可能是 access 已被另一调用端轮换，
        可尝试一次共享 refresh；只有 refresh 端点的 invalid_token 才代表绑定凭据无效。
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/AuthenticationErrorResponse"
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    PublicationErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [request_too_large, invalid_metadata, publish_rate_limited, publish_daily_quota]
            message:
              type: string
    CertificateStatus:
      type: object
      required: [server_time, certificates, gateway_state]
      properties:
        server_time:
          type: string
          format: date-time
        gateway_state:
          type: string
          enum: [available, unavailable, disabled]
        certificates:
          type: array
          items:
            type: object
            required: [id, endpoint, fingerprint, not_after, observed_at]
            properties:
              id:
                type: string
                enum: [backend, public-https]
              endpoint:
                type: string
              fingerprint:
                type: string
                description: 整张 DER 证书的 SHA-256，64 位十六进制。
              not_after:
                type: string
                format: date-time
              observed_at:
                type: string
                format: date-time
    AuthenticationErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [code, message, server_time]
          properties:
            code:
              type: string
              enum: [access_token_expired, refresh_token_expired, device_revoked, invalid_token]
            message:
              type: string
            server_time:
              type: string
              format: date-time
    DeviceBindRequest:
      type: object
      additionalProperties: false
      required: [name, platform]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        platform:
          type: string
          enum: [windows, android]
        refresh_token:
          type: [string, "null"]
          description: 可选。证明已有设备身份并轮换凭据，保留原角色与刷新到期时间。已到期或撤销的凭据不能自助重绑。
    DeviceBindResponse:
      type: object
      required: [device, refresh_token, access_token, token_type, access_expires_at, refresh_expires_at, server_time]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        refresh_token:
          type: string
        access_token:
          type: string
        access_expires_at:
          type: [string, "null"]
          format: date-time
        refresh_expires_at:
          type: [string, "null"]
          format: date-time
          description: 刷新到期时间；null 表示永久。与 device 内字段一致。
        server_time:
          type: string
          format: date-time
        token_type:
          type: string
          const: bearer
    DeviceUpdateRequest:
      type: object
      description: 有效期字段省略则保持原值。相对天数从本次修改计算。不能将最后可用管理员改为有限期限（409 / last_admin_must_be_permanent）。
      not:
        required: [refresh_ttl_days, refresh_expires_at]
      additionalProperties: false
      properties:
        refresh_ttl_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 36500
          description: 仅管理员可设。相对天数，null 为永久；不能与 refresh_expires_at 同时提供。
        refresh_expires_at:
          type: [string, "null"]
          format: date-time
          description: 仅管理员可设。带时区的未来绝对到期时间，null 为永久；不能与 refresh_ttl_days 同时提供。
        name:
          type: string
          minLength: 1
          maxLength: 80
        notifications_enabled:
          type: boolean
        role:
          $ref: "#/components/schemas/DeviceRole"
          description: 仅管理员可修改，包括自身角色。
    DevicePresenceUpdateRequest:
      type: object
      required: [session_state]
      properties:
        session_state:
          type: string
          enum: [unknown, locked, unlocked]
        notification_pause_until:
          type: [string, "null"]
          format: date-time
        suppress_codex_permission_requests:
          type: boolean
          default: false
          description: 来源 Windows 设备是否启用 Codex 普通权限审批提醒抑制策略。
    WindowsDevicePresence:
      type: object
      required: [device_id, device_name, reported_session_state, effective_session_state]
      properties:
        device_id:
          type: string
        device_name:
          type: string
        reported_session_state:
          type: string
          enum: [unknown, locked, unlocked]
        effective_session_state:
          type: string
          enum: [unknown, locked, unlocked]
        session_state_updated_at:
          type: [string, "null"]
          format: date-time
        suppress_codex_permission_requests:
          type: boolean
          default: false
          description: 来源 Windows 设备是否启用 Codex 普通权限审批提醒抑制策略。
    DevicePresenceSummary:
      type: object
      required: [any_unlocked_windows, any_unlocked_unpaused_windows, registered_windows, fresh_windows, evaluated_at, stale_after_seconds, windows_devices]
      properties:
        any_unlocked_windows:
          type: boolean
        any_unlocked_unpaused_windows:
          type: boolean
          description: 至少一台状态有效的 Windows 设备未锁屏且未暂停通知时为 true。
        registered_windows:
          type: integer
          minimum: 0
        fresh_windows:
          type: integer
          minimum: 0
        evaluated_at:
          type: string
          format: date-time
        stale_after_seconds:
          type: integer
          minimum: 1
        windows_devices:
          type: array
          items:
            $ref: "#/components/schemas/WindowsDevicePresence"
    TokenRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
          minLength: 1
    AccessTokenResponse:
      type: object
      required: [device, access_token, token_type, access_expires_at, refresh_expires_at, server_time]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        access_token:
          type: string
        access_expires_at:
          type: [string, "null"]
          format: date-time
        refresh_expires_at:
          type: [string, "null"]
          format: date-time
          description: 刷新到期时间；null 表示永久。与 device 内字段一致。
        server_time:
          type: string
          format: date-time
        token_type:
          type: string
          const: bearer
    DeviceRole:
      type: string
      enum: [admin, member, guest]
    PairStatusRequest:
      type: object
      required: [code]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
    PairStatusResponse:
      type: object
      required: [consumed, expired]
      properties:
        consumed:
          type: boolean
        expired:
          type: boolean
        consumed_device_name:
          type: [string, "null"]
    PairIssueRequest:
      type: object
      description: 有效期字段省略则默认绑定后 90 天（可由服务端配置覆盖）。相对天数从配对消费成功时计算，绝对日期在消费时已过期则配对失败。
      not:
        required: [refresh_ttl_days, refresh_expires_at]
      additionalProperties: false
      properties:
        refresh_ttl_days:
          type: [integer, "null"]
          minimum: 1
          maximum: 36500
          description: 仅管理员可设。相对天数，null 为永久；不能与 refresh_expires_at 同时提供。
        refresh_expires_at:
          type: [string, "null"]
          format: date-time
          description: 仅管理员可设。带时区的未来绝对到期时间，null 为永久；不能与 refresh_ttl_days 同时提供。
        role:
          $ref: "#/components/schemas/DeviceRole"
          default: member
    PairIssueResponse:
      type: object
      required: [code, expires_at, role]
      properties:
        role:
          $ref: "#/components/schemas/DeviceRole"
        code:
          type: string
          description: 一次性可读配对码，例如 7Q4K-9XKM。
        expires_at:
          type: string
          format: date-time
        candidate_base_urls:
          type: array
          items:
            type: string
          description: 服务端提供的候选连接地址；客户端仍需选择新设备实际可达的地址。
        server_fingerprint:
          type: [string, "null"]
          description: 服务端证书的 SHA-256 指纹；未配置或无法读取证书时可能为空。
    PairConsumeRequest:
      type: object
      additionalProperties: false
      required: [code, name, platform]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 40
        name:
          type: string
          minLength: 1
          maxLength: 80
        platform:
          type: string
          enum: [windows, android]
    Device:
      type: object
      required: [id, name, platform, role, created_at, notifications_enabled, notification_pause_until, session_state, refresh_expires_at, access_expires_at]
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
          enum: [windows, android]
        role:
          $ref: "#/components/schemas/DeviceRole"
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        refresh_expires_at:
          type: [string, "null"]
          format: date-time
          description: null 表示永久；有限期限到期后等待管理员延期，撤销设备不能恢复。
        access_expires_at:
          type: [string, "null"]
          format: date-time
          description: 当前访问令牌到期时间；新签发值不晚于 refresh_expires_at。null 仅兼容旧数据。
        notifications_enabled:
          type: boolean
        notification_pause_until:
          type: [string, "null"]
          format: date-time
        session_state:
          type: string
          enum: [unknown, locked, unlocked]
        session_state_updated_at:
          type: [string, "null"]
          format: date-time
    NotificationLevel:
      type: string
      enum: [info, success, important, critical]
    NotificationStatus:
      type: string
      enum: [active, acknowledged, expired, cancelled]
    NotificationCreate:
      type: object
      required: [source, session_id, title, body]
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 40
        session_id:
          type: string
          minLength: 1
          maxLength: 120
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 2000
        level:
          $ref: "#/components/schemas/NotificationLevel"
        expires_at:
          type: [string, "null"]
          format: date-time
        requires_ack:
          type: boolean
        metadata:
          type: object
          description: >-
            紧凑 JSON 的 UTF-8 编码最多 65536 字节，嵌套深度最多 8（根为 0）、总值数最多 4096（包含根和容器）。
            kind、标签、事件名称、工具名称等控制字段（含 raw 内同名字段）只接受标量；tool_input 等保留结构化 JSON。
            local_only、countdown_local、alarm_local、controllable、alarm_preview 及其 camelCase 形式会从网络 metadata 移除。
            本机来源按 origin_device_id 判断，不采用上述标记。Hook 缺少可展示文本而使用默认正文时带 body_generated=true。
          properties:
            body_generated:
              type: boolean
              description: 服务端用默认回退正文时为 true。
            tag:
              type: string
              description: 可选任务标签。Hook Bridge 从 SESSION_NOTIFY_TAG 写入，客户端做有界展示。
            privacy_tag:
              type: string
              enum: [hide, local]
              description: >-
                可选隐私模式。hide：所有设备下发的正文替换为 ***。
                local：仅来源设备看到明文，其他设备替换为 ***。
                服务端存储保持明文，仅在 REST / WebSocket 下发时替换。
                正文不可见时 metadata 只下发展示和关联控制字段；raw、工具输入和自由文本诊断不下发。
                Hook Bridge 从 SESSION_NOTIFY_PRIVACY_TAG 写入此字段。
          additionalProperties: true
    Notification:
      allOf:
        - $ref: "#/components/schemas/NotificationCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            origin_device_id:
              type: [string, "null"]
              description: 创建通知的认证设备 ID。
            origin_device_name:
              type: [string, "null"]
              description: 创建通知的设备显示名称。
            origin_device_platform:
              type: [string, "null"]
              enum: [windows, android, null]
              description: 创建通知的设备平台。
            status:
              $ref: "#/components/schemas/NotificationStatus"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    NotificationHistoryMachineOption:
      type: object
      required: [name]
      properties:
        id:
          type: [string, "null"]
          maxLength: 120
        name:
          type: string
          maxLength: 120
    NotificationHistoryFilterOptions:
      type: object
      required: [machines, agents, tags, truncated]
      properties:
        machines:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/NotificationHistoryMachineOption"
        agents:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 40
        tags:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 120
        truncated:
          type: boolean
          description: 任一候选列表超过服务端上限时为 true；仍可手动输入筛选文字。
    NotificationPage:
      type: object
      required: [items, has_more, requested_days, effective_days, limit, total_count, total_pages, filter_options]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
        requested_days:
          type: integer
        effective_days:
          type: integer
          maximum: 30
        limit:
          type: integer
          maximum: 100
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        filter_options:
          description: 当前 days、status、level 及可见范围内的候选值，不受 machine、agent、tag 和 q 筛选影响。
          $ref: "#/components/schemas/NotificationHistoryFilterOptions"
    AckRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 80
          default: user_confirmed
    AckResponse:
      type: object
      required: [notification, already_acknowledged]
      properties:
        notification:
          $ref: "#/components/schemas/Notification"
        already_acknowledged:
          type: boolean
    EventsResponse:
      type: object
      required: [events, latest_event_id, cursor_found, has_more]
      properties:
        events:
          type: array
          items:
            $ref: "./ws-events.schema.json"
        latest_event_id:
          type: [string, "null"]
        cursor_found:
          type: [boolean, "null"]
          description: 未提供游标时为 null，所提供游标不存在时为 false。
        has_more:
          type: boolean
    CodexAsyncQuestionAsked:
      type: object
      required: [kind, observed_at, call_id, question_hashes]
      properties:
        kind:
          const: asked
        observed_at:
          type: string
          format: date-time
        call_id:
          type: string
          minLength: 1
          maxLength: 200
        question_hashes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: '^[a-f0-9]{64}$'
    CodexAsyncQuestionAnswered:
      type: object
      required: [kind, observed_at, question_hash]
      properties:
        kind:
          const: answered
        observed_at:
          type: string
          format: date-time
        question_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    CodexAsyncAnswerItem:
      type: object
      required: [call_id, question_index, question_hash]
      properties:
        call_id:
          type: string
          minLength: 1
          maxLength: 200
        question_index:
          type: integer
          minimum: 0
          maximum: 99
        question_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    CodexAsyncQuestionsAnswered:
      type: object
      required: [kind, observed_at, answers]
      properties:
        kind:
          const: answered_batch
        observed_at:
          type: string
          format: date-time
        answers:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/CodexAsyncAnswerItem"
    HookPayload:
      type: object
      description: 完整输入（包含额外字段）按紧凑 JSON 的 UTF-8 编码最多 65536 字节，深度最多 8（根为 0）、总值数最多 4096；生成和合并后的 metadata 同样校验。
      additionalProperties: true
      properties:
        hook_event_name:
          type: [string, "null"]
        hook_status:
          type: [string, "null"]
        notification_type:
          type: [string, "null"]
        title:
          type: [string, "null"]
        last_assistant_message:
          type: [string, "null"]
        cwd:
          type: [string, "null"]
        transcript_path:
          type: [string, "null"]
        tool_name:
          type: [string, "null"]
        tool_input:
          type: [object, "null"]
          additionalProperties: true
        event_type:
          type: [string, "null"]
        notification_title:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
          description: 外部 Hook Bridge 调用方可选的标题覆盖值；自动安装的 Agent Hook 不设置此字段。
        notification_level:
          oneOf:
            - $ref: "#/components/schemas/NotificationLevel"
            - type: "null"
          description: 外部 Hook Bridge 调用方可选的级别覆盖值；自动安装的 Agent Hook 不设置此字段。
        message:
          type: [string, "null"]
        prompt:
          type: [string, "null"]
        command:
          type: [string, "null"]
        summary:
          type: [string, "null"]
        session_id:
          type: [string, "null"]
        turn_id:
          type: [string, "null"]
        permission_mode:
          type: [string, "null"]
        codex_async:
          oneOf:
            - $ref: "#/components/schemas/CodexAsyncQuestionAsked"
            - $ref: "#/components/schemas/CodexAsyncQuestionAnswered"
            - $ref: "#/components/schemas/CodexAsyncQuestionsAnswered"
            - type: "null"
          description: >-
            可选的 Codex 异步问题关联，范围限定为认证来源设备和 session_id。
            将完整题目的 CRLF/CR 归一化为 LF 后，对 UTF-8 文本计算 SHA-256，先于摘要裁剪。
            Bridge 在入队前写入 observed_at 和 metadata.delivery_id。
            asked 仅接受 request_user_input_async 的 PreToolUse 事件；
            answered 和 answered_batch 仅接受 UserPromptSubmit。
            answered 按旧版完整题目指纹唯一匹配；answered_batch 使用 questionItemId
            中的 call_id、从 0 开始的 question_index 及完整题目指纹，不回退为仅按题目匹配。
            回答正文不上传。整批关联原子持久化，支持乱序补发和跨 turn_id 回答。
            一次调用的全部问题回答完毕后，才发出 reason 为 async_question_answered 的
            notification.acknowledged；提交回答本身不创建通知。
            迟到事件使旧匹配出现歧义时，仅撤销未过期通知的自动确认，并以原 ID 发送
            reason 为 async_question_ambiguous 的 notification.created 更新。
            手动确认不撤销。
        metadata:
          type: object
          properties:
            tag:
              type: string
              description: 可选任务标签。Windows Hook Bridge 从 SESSION_NOTIFY_TAG 写入并限制长度；API 对 metadata 执行整体预算和控制字段标量校验。
            privacy_tag:
              type: string
              enum: [hide, local]
              description: >-
                可选隐私模式。hide：所有设备下发的正文替换为 ***。
                local：仅来源设备看到明文，其他设备替换为 ***。
                服务端存储保持明文，仅在 REST / WebSocket 下发时替换。
                正文不可见时 metadata 只下发展示和关联控制字段；raw、工具输入和自由文本诊断不下发。
                Windows Hook Bridge 从 SESSION_NOTIFY_PRIVACY_TAG 写入。
          additionalProperties: true

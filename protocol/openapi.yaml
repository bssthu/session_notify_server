openapi: 3.1.0
info:
  title: Session Notify API
  version: 0.1.0
servers:
  - url: https://localhost:8765
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      responses:
        "200":
          description: Service health.
  /api/v1/devices/bind:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceBindRequest"
      responses:
        "200":
          description: Device credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBindResponse"
  /api/v1/devices/pair/issue:
    post:
      responses:
        "200":
          description: One-time pairing code signed by an already-bound device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairIssueResponse"
  /api/v1/devices/pair/consume:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairConsumeRequest"
      responses:
        "200":
          description: Newly bound device credentials (same shape as bind).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceBindResponse"
  /api/v1/devices/reset:
    post:
      security: []
      description: Revoke all devices and return to bootstrap state. Localhost-only (127.0.0.1/::1).
      responses:
        "200":
          description: Count of revoked devices.
          content:
            application/json:
              schema:
                type: object
                properties:
                  revoked:
                    type: integer
        "403":
          description: Called from a non-localhost host.
  /api/v1/devices:
    get:
      responses:
        "200":
          description: Bound devices.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
  /api/v1/devices/presence:
    get:
      responses:
        "200":
          description: Effective Windows session presence after stale reports are downgraded to unknown.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePresenceSummary"
  /api/v1/devices/me/presence:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DevicePresenceUpdateRequest"
      responses:
        "200":
          description: Updated effective Windows presence summary.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicePresenceSummary"
        "422":
          description: Only a bound Windows device can report desktop session state.
  /api/v1/devices/{device_id}:
    patch:
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdateRequest"
      responses:
        "200":
          description: Updated device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
    delete:
      parameters:
        - name: device_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Revoked device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
  /api/v1/auth/refresh:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TokenRefreshRequest"
      responses:
        "200":
          description: New access token for an existing device.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
  /api/v1/notifications:
    get:
      description: Returns matching notifications created within the server-enforced latest 30-day window. Defaults to active notifications.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/NotificationStatus"
      responses:
        "200":
          description: Notifications.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationCreate"
      responses:
        "200":
          description: Created notification.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /api/v1/notifications/recent:
    get:
      description: Returns a newest-first cursor page. Requested ranges above 30 days are clamped to 30 days.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/NotificationStatus"
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: cursor
          in: query
          required: false
          schema:
            type: string
        - name: visible_only
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: suppress_codex_permission_requests
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: machine
          in: query
          required: false
          description: Case-insensitive literal substring matched against origin device name or ID.
          schema:
            type: string
            maxLength: 120
        - name: agent
          in: query
          required: false
          description: Case-insensitive literal substring matched against notification source.
          schema:
            type: string
            maxLength: 40
        - name: tag
          in: query
          required: false
          description: 大小写不敏感的字面子串，匹配通知 metadata 中的任务标签。
          schema:
            type: string
            maxLength: 120
        - name: q
          in: query
          required: false
          description: 大小写不敏感的字面子串，匹配标题、正文、会话、来源、机器名和标签。对 hide 正文，或非来源设备查看 local 正文时，不会用存储中的明文正文做关键词匹配。
          schema:
            type: string
            maxLength: 160
      responses:
        "200":
          description: A page of recent notifications.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
  /api/v1/notifications/{notification_id}/ack:
    post:
      parameters:
        - name: notification_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AckRequest"
      responses:
        "200":
          description: Ack result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AckResponse"
  /api/v1/events:
    get:
      parameters:
        - name: since_event_id
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Bounds catch-up payloads. Without a cursor, returns only the latest event id for baseline initialization.
          schema:
            type: integer
            minimum: 1
            maximum: 500
      responses:
        "200":
          description: Event stream catch-up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventsResponse"
  /api/v1/hooks/{source}:
    post:
      parameters:
        - name: source
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HookPayload"
      responses:
        "200":
          description: Notification generated from hook payload.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /api/v1/ws:
    get:
      summary: WebSocket endpoint.
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
      responses:
        "101":
          description: WebSocket upgrade. Messages conform to ws-events.schema.json.
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    DeviceBindRequest:
      type: object
      required: [name, platform]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        platform:
          type: string
          enum: [windows, android]
        refresh_token:
          type: [string, "null"]
          description: Optional. Under strict mode, proves local identity for a rebind instead of requiring a pairing code.
    DeviceBindResponse:
      type: object
      required: [device, refresh_token, access_token, token_type]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        refresh_token:
          type: string
        access_token:
          type: string
        access_expires_at:
          type: [string, "null"]
          format: date-time
        token_type:
          type: string
          const: bearer
    DeviceUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        notifications_enabled:
          type: boolean
    DevicePresenceUpdateRequest:
      type: object
      required: [session_state]
      properties:
        session_state:
          type: string
          enum: [unknown, locked, unlocked]
        notification_pause_until:
          type: [string, "null"]
          format: date-time
    WindowsDevicePresence:
      type: object
      required: [device_id, device_name, reported_session_state, effective_session_state]
      properties:
        device_id:
          type: string
        device_name:
          type: string
        reported_session_state:
          type: string
          enum: [unknown, locked, unlocked]
        effective_session_state:
          type: string
          enum: [unknown, locked, unlocked]
        session_state_updated_at:
          type: [string, "null"]
          format: date-time
    DevicePresenceSummary:
      type: object
      required: [any_unlocked_windows, any_unlocked_unpaused_windows, registered_windows, fresh_windows, evaluated_at, stale_after_seconds, windows_devices]
      properties:
        any_unlocked_windows:
          type: boolean
        any_unlocked_unpaused_windows:
          type: boolean
          description: True when at least one fresh Windows device is unlocked and has not paused notifications.
        registered_windows:
          type: integer
          minimum: 0
        fresh_windows:
          type: integer
          minimum: 0
        evaluated_at:
          type: string
          format: date-time
        stale_after_seconds:
          type: integer
          minimum: 1
        windows_devices:
          type: array
          items:
            $ref: "#/components/schemas/WindowsDevicePresence"
    TokenRefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token:
          type: string
    AccessTokenResponse:
      type: object
      required: [device, access_token, token_type]
      properties:
        device:
          $ref: "#/components/schemas/Device"
        access_token:
          type: string
        access_expires_at:
          type: [string, "null"]
          format: date-time
        token_type:
          type: string
          const: bearer
    PairIssueResponse:
      type: object
      required: [code, expires_at]
      properties:
        code:
          type: string
          description: One-time human-readable pairing code, e.g. 7Q4K-9XKM.
        expires_at:
          type: string
          format: date-time
    PairConsumeRequest:
      type: object
      required: [code, name, platform]
      properties:
        code:
          type: string
        name:
          type: string
          minLength: 1
          maxLength: 80
        platform:
          type: string
          enum: [windows, android]
    Device:
      type: object
      required: [id, name, platform, created_at, notifications_enabled, notification_pause_until, session_state]
      properties:
        id:
          type: string
        name:
          type: string
        platform:
          type: string
          enum: [windows, android]
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: [string, "null"]
          format: date-time
        revoked_at:
          type: [string, "null"]
          format: date-time
        notifications_enabled:
          type: boolean
        notification_pause_until:
          type: [string, "null"]
          format: date-time
        session_state:
          type: string
          enum: [unknown, locked, unlocked]
        session_state_updated_at:
          type: [string, "null"]
          format: date-time
    NotificationLevel:
      type: string
      enum: [info, success, important, critical]
    NotificationStatus:
      type: string
      enum: [active, acknowledged, expired, cancelled]
    NotificationCreate:
      type: object
      required: [source, session_id, title, body]
      properties:
        source:
          type: string
        session_id:
          type: string
        title:
          type: string
        body:
          type: string
        level:
          $ref: "#/components/schemas/NotificationLevel"
        expires_at:
          type: [string, "null"]
          format: date-time
        requires_ack:
          type: boolean
        metadata:
          type: object
          description: 任意通知元数据。Hook 通知在服务端因 payload 没有可展示文本而写入默认正文时会带 `body_generated=true`。
          properties:
            body_generated:
              type: boolean
              description: 服务端用默认回退正文时为 true。
            tag:
              type: string
              description: 可选任务标签。Hook Bridge 从 SESSION_NOTIFY_TAG 写入，客户端做有界展示。
            privacy_tag:
              type: string
              enum: [hide, local]
              description: >-
                可选隐私模式。hide：所有设备下发的正文替换为 ***。
                local：仅来源设备看到明文，其他设备替换为 ***。
                服务端存储保持明文，仅在 REST / WebSocket 下发时替换。
                正文不可见时 metadata 只下发展示和关联控制字段；raw、工具输入和自由文本诊断不下发。
                Hook Bridge 从 SESSION_NOTIFY_PRIVACY_TAG 写入此字段。
          additionalProperties: true
    Notification:
      allOf:
        - $ref: "#/components/schemas/NotificationCreate"
        - type: object
          required: [id, status, created_at, updated_at]
          properties:
            id:
              type: string
            origin_device_id:
              type: [string, "null"]
              description: Device id that created the notification.
            origin_device_name:
              type: [string, "null"]
              description: Device display name that created the notification.
            origin_device_platform:
              type: [string, "null"]
              enum: [windows, android, null]
              description: Platform of the device that created the notification.
            status:
              $ref: "#/components/schemas/NotificationStatus"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    NotificationHistoryMachineOption:
      type: object
      required: [name]
      properties:
        id:
          type: [string, "null"]
          maxLength: 120
        name:
          type: string
          maxLength: 120
    NotificationHistoryFilterOptions:
      type: object
      required: [machines, agents, tags, truncated]
      properties:
        machines:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/NotificationHistoryMachineOption"
        agents:
          type: array
          maxItems: 50
          items:
            type: string
            maxLength: 40
        tags:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 120
        truncated:
          type: boolean
          description: True when at least one candidate list exceeded its server-side limit; free-text filtering remains available.
    NotificationPage:
      type: object
      required: [items, has_more, requested_days, effective_days, limit, total_count, total_pages, filter_options]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        next_cursor:
          type: [string, "null"]
        has_more:
          type: boolean
        requested_days:
          type: integer
        effective_days:
          type: integer
          maximum: 30
        limit:
          type: integer
          maximum: 100
        total_count:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0
        filter_options:
          description: Candidate values from the current days, status, and visibility scope; independent of machine, agent, tag, and q filters.
          $ref: "#/components/schemas/NotificationHistoryFilterOptions"
    AckRequest:
      type: object
      properties:
        reason:
          type: string
          default: user_confirmed
    AckResponse:
      type: object
      required: [notification, already_acknowledged]
      properties:
        notification:
          $ref: "#/components/schemas/Notification"
        already_acknowledged:
          type: boolean
    EventsResponse:
      type: object
      required: [events, latest_event_id, cursor_found, has_more]
      properties:
        events:
          type: array
          items:
            $ref: "./ws-events.schema.json"
        latest_event_id:
          type: [string, "null"]
        cursor_found:
          type: [boolean, "null"]
          description: Null when no cursor was supplied, false when the supplied cursor is unknown.
        has_more:
          type: boolean
    CodexAsyncQuestionAsked:
      type: object
      required: [kind, observed_at, call_id, question_hashes]
      properties:
        kind:
          const: asked
        observed_at:
          type: string
          format: date-time
        call_id:
          type: string
          minLength: 1
          maxLength: 200
        question_hashes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: string
            pattern: '^[a-f0-9]{64}$'
    CodexAsyncQuestionAnswered:
      type: object
      required: [kind, observed_at, question_hash]
      properties:
        kind:
          const: answered
        observed_at:
          type: string
          format: date-time
        question_hash:
          type: string
          pattern: '^[a-f0-9]{64}$'
    HookPayload:
      type: object
      properties:
        event_type:
          type: [string, "null"]
        notification_title:
          type: [string, "null"]
          minLength: 1
          maxLength: 120
          description: Optional explicit title override for external Hook Bridge callers. Installed agent hooks do not set it.
        notification_level:
          oneOf:
            - $ref: "#/components/schemas/NotificationLevel"
            - type: "null"
          description: Optional explicit level override for external Hook Bridge callers. Installed agent hooks do not set it.
        message:
          type: [string, "null"]
        prompt:
          type: [string, "null"]
        command:
          type: [string, "null"]
        summary:
          type: [string, "null"]
        session_id:
          type: [string, "null"]
        turn_id:
          type: [string, "null"]
        permission_mode:
          type: [string, "null"]
        codex_async:
          oneOf:
            - $ref: "#/components/schemas/CodexAsyncQuestionAsked"
            - $ref: "#/components/schemas/CodexAsyncQuestionAnswered"
            - type: "null"
          description: >-
            Optional Codex async-question correlation, scoped to the authenticated
            origin device and session_id. SHA-256 covers the full UTF-8 title with
            CRLF/CR normalized to LF, before summary truncation. The bridge supplies
            observed_at and metadata.delivery_id before queuing delivery. Asked is
            accepted only for request_user_input_async PreToolUse; answered only for
            UserPromptSubmit. Unique title matches may cross turn_id; all questions
            in a call must be answered before notification.acknowledged is emitted
            with reason async_question_answered. Submission creates no notification.
            Late delivery that makes a prior match ambiguous retracts only automatic
            acknowledgements of unexpired notifications, using notification.created
            as an upsert of the original id with reason async_question_ambiguous.
            Manual acknowledgements are never retracted.
        metadata:
          type: object
          properties:
            tag:
              type: string
              maxLength: 120
              description: 可选任务标签。Windows Hook Bridge 从 SESSION_NOTIFY_TAG 写入。
            privacy_tag:
              type: string
              enum: [hide, local]
              description: >-
                可选隐私模式。hide：所有设备下发的正文替换为 ***。
                local：仅来源设备看到明文，其他设备替换为 ***。
                服务端存储保持明文，仅在 REST / WebSocket 下发时替换。
                正文不可见时 metadata 只下发展示和关联控制字段；raw、工具输入和自由文本诊断不下发。
                Windows Hook Bridge 从 SESSION_NOTIFY_PRIVACY_TAG 写入。
          additionalProperties: true

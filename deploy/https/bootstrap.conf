# No TLS certificate is needed for bootstrap. Port 443 does not serve yet.
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    error_log /dev/stderr crit;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 404; }
}
